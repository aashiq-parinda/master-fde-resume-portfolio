name: Multicloud Integration Platform CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      cloud_provider:
        description: 'Target Cloud Provider to Deploy'
        required: true
        default: 'aws'
        type: choice
        options:
        - aws
        - azure

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r enterprise-integration-platform/requirements.txt

    - name: Run Pytest
      run: |
        cd enterprise-integration-platform
        PYTHONPATH=. pytest tests/

  deploy_aws:
    name: Deploy to AWS
    needs: test
    if: ${{ github.event.inputs.cloud_provider == 'aws' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1

    - name: Terraform Init & Apply
      run: |
        cd enterprise-integration-platform/terraform/aws
        terraform init
        terraform plan -var="db_password=${{ secrets.AWS_DB_PASSWORD }}" -var="rest_api_key=${{ secrets.REST_API_KEY }}" -var="xml_password=${{ secrets.XML_PASSWORD }}" -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}" -out=tfplan
        terraform apply -auto-approve tfplan

  deploy_azure:
    name: Deploy to Azure
    needs: test
    if: ${{ github.event.inputs.cloud_provider == 'azure' && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Terraform
      uses: hashicorp/setup-terraform@v2
      with:
        terraform_version: 1.5.0

    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}

    - name: Terraform Init & Apply
      run: |
        cd enterprise-integration-platform/terraform/azure
        terraform init
        terraform plan -var="db_password=${{ secrets.AZURE_DB_PASSWORD }}" -var="rest_api_key=${{ secrets.REST_API_KEY }}" -var="xml_password=${{ secrets.XML_PASSWORD }}" -var="webhook_secret=${{ secrets.WEBHOOK_SECRET }}" -out=tfplan
        terraform apply -auto-approve tfplan
