version: '3.8'

services:
  agent-api:
    build: .
    container_name: enterprise-operations-api
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8003
    ports:
      - "8003:8003"
    environment:
      - ENV=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3

  agent-dashboard:
    build: .
    container_name: enterprise-operations-dashboard
    command: streamlit run src/dashboard/app.py --server.port 8504 --server.address 0.0.0.0
    ports:
      - "8504:8504"
    environment:
      - API_URL=http://agent-api:8003
    depends_on:
      - agent-api
    restart: unless-stopped
