<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 44" width="100%" height="44" role="img" aria-label="ENTERPRISE FDE SYSTEMS">
  <defs>
    <linearGradient id="hBg_03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#190B12" />
      <stop offset="50%" stop-color="#10070C" />
      <stop offset="100%" stop-color="#190B12" />
    </linearGradient>
    <linearGradient id="hBeam_03" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0" />
      <stop offset="30%" stop-color="#701A3D" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#C77B9B" stop-opacity="1" />
      <stop offset="70%" stop-color="#701A3D" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#451126" stop-opacity="0" />
      <animate attributeName="x1" values="-100%;100%;-100%" dur="7s" repeatCount="indefinite" />
      <animate attributeName="x2" values="0%;200%;0%" dur="7s" repeatCount="indefinite" />
    </linearGradient>
    <pattern id="hGrid_03" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M 22 0 L 0 0 0 22" fill="none" stroke="#451126" stroke-width="0.5" stroke-opacity="0.35" />
    </pattern>
  </defs>

  <style>
    .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    .hdr-title { font-size: 13.5px; font-weight: 800; letter-spacing: 2.5px; text-transform: uppercase; fill: #F8F0F3; }
    .hdr-sub { font-size: 11px; font-weight: 500; letter-spacing: 1px; fill: #C77B9B; }
    .hdr-tag { font-size: 10px; font-weight: 700; letter-spacing: 1.5px; fill: #E5B5C7; text-anchor: end; }
  </style>

  <!-- Container -->
  <rect x="1" y="1" width="878" height="42" rx="8" fill="url(#hBg_03)" stroke="#451126" stroke-width="1.2" />
  <rect x="1" y="1" width="878" height="42" rx="8" fill="url(#hGrid_03)" />

  <!-- Left Accent Node -->
  <g transform="translate(20, 22)">
    <circle cx="0" cy="0" r="5" fill="#701A3D" />
    <circle cx="0" cy="0" r="3" fill="#C77B9B">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Header Title -->
  <text x="38" y="26" class="font-sans hdr-title">ENTERPRISE FDE SYSTEMS</text>
  <text x="360" y="26" class="font-sans hdr-sub">· Self-Built Production Architectures</text>

  <!-- Right Technical Badge -->
  <text x="856" y="26" class="font-mono hdr-tag">[03 // VERIFIED]</text>

  <!-- Bottom Animated Shimmer Line -->
  <rect x="20" y="41" width="838" height="1.5" fill="#451126" />
  <rect x="20" y="41" width="838" height="1.5" fill="url(#hBeam_03)" />
</svg>